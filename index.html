<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Portfolio - Ly Rajaonesy</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      padding: 20px;
    }
    .project {
      background: #1e293b;
      padding: 15px;
      margin: 10px 0;
      border-radius: 10px;
    }
    a { color: #38bdf8; }
  </style>
</head>
<body>

<h1>STAGIAIRE EN ALTERNANCE</h1>
<h2>Administration Système et Réseau</h2>

<p>Bienvenue sur mon portfolio GitHub 🚀</p>

<h3>📂 Mes projets</h3>
<div id="projects"></div>

<script>
fetch("https://api.github.com/users/TON_PSEUDO/repos")
  .then(response => response.json())
  .then(repos => {
    const container = document.getElementById("projects");
    repos.forEach(repo => {
      const div = document.createElement("div");
      div.className = "project";
      div.innerHTML = `
        <h4>${repo.name}</h4>
        <p>${repo.description || "Aucune description"}</p>
        <a href="${repo.html_url}" target="_blank">Voir sur GitHub</a>
      `;
      container.appendChild(div);
    });
  });
</script>

</body>
</html>
